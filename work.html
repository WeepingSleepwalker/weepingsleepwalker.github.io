<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work | Francis Chung</title>
    <meta
      name="description"
      content="Selected sculptural works and installation placeholders ready to be replaced with final photography and metadata."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="page-work">
    <div class="page-backdrop" aria-hidden="true"></div>
    <header class="site-header">
      <div class="shell header-shell">
        <a class="brand" href="index.html">Francis Chung</a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          data-menu-toggle
        >
          Menu
        </button>
        <nav class="site-nav" id="site-nav" data-site-nav>
          <a href="index.html">Home</a>
          <a href="work.html">Work</a>
          <a href="writing.html">Writing</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="shell page-main">
      <section class="page-intro" data-reveal>
        <p class="eyebrow">Selected Work</p>
        <h1>A selection of recent sculptural works and installations.</h1>
        <p class="page-summary">
          Selected works, 2018 &mdash; present.
        </p>
      </section>

      <section class="work-grid">
        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/Uprightness/uprightness-work.jpg"
                alt="Uprightness ceramic sculpture view"
                data-work-modal-src="assets/workpics/Uprightness/uprightness-view.jpg"
              />
            </div>
            <div class="work-copy">
              <h2>Uprightness</h2>
              <p class="work-meta">2026 / Ceramic / 14" by 6" by 6"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/Iwasneverthere/iwasneverthere-work.jpg"
                alt="I Was Never There ceramic sculpture view"
                data-work-modal-src="assets/workpics/Iwasneverthere/iwasneverthere-view.jpg"
              />
            </div>
            <div class="work-copy">
              <h2>I Was Never There</h2>
              <p class="work-meta">2026 / Ceramic / 16" by 11" by 11"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/Gravity/gravity-work.jpg"
                alt="Gravity ceramic sculpture view"
                data-work-modal-src="assets/workpics/Gravity/gravity-view.jpg"
              />
            </div>
            <div class="work-copy">
              <h2>Gravity</h2>
              <p class="work-meta">2025 / Ceramic / 10" by 8" by 8"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/SuperStressed/superstressed-work.jpg"
                alt="SuperStressed ceramic sculpture view"
                data-work-modal-src="assets/workpics/SuperStressed/superstressed-view.jpg"
              />
            </div>
            <div class="work-copy">
              <h2>SuperStressed</h2>
              <p class="work-meta">2026 / Ceramic / 17" by 13" by 6"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/babytreepics/frontal-work.png"
                alt="Little Baby under a Pine installation view"
                data-work-modal-src="assets/workpics/babytreepics/frontal-view.png"
              />
            </div>
            <div class="work-gallery" hidden>
              <img
                class="work-gallery__item"
                src="assets/workpics/babytreepics/babyclean.png"
                alt="Little Baby under a Pine alternate installation view"
              />
              <img
                class="work-gallery__item"
                src="assets/workpics/babytreepics/IMG_1532.jpeg"
                alt="Little Baby under a Pine detail view"
              />
              <img
                class="work-gallery__item"
                src="assets/workpics/babytreepics/littlebabytree.jpg"
                alt="Little Baby under a Pine alternate installation view"
              />
            </div>
            <div class="work-copy">
              <h2>Little Baby under a Pine</h2>
              <p class="work-meta">2019 / Marble, Lasers, Pine Tree / Installation / 4' by 4' by 4'</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/source-of-mirth-work.jpg"
                alt="Source of Mirth sculpture view"
                data-work-modal-src="assets/workpics/source-of-mirth-view.jpg"
              />
            </div>
            <div class="work-gallery" hidden>
              <img
                class="work-gallery__item"
                src="assets/workpics/source-of-mirth-view.jpg"
                alt="Source of Mirth sculpture view"
              />
            </div>
            <div class="work-copy">
              <h2>Source of Mirth</h2>
              <p class="work-meta">2018 / Glass concrete / Ceramic / Neon / 18" by 7" by 7"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>
      </section>

      <div class="work-modal" data-work-modal hidden>
        <button
          class="work-modal__backdrop"
          type="button"
          data-work-close
          tabindex="-1"
          aria-hidden="true"
        ></button>
        <div
          class="work-modal__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="work-modal-title"
        >
          <button
            class="work-modal__close"
            type="button"
            data-work-close
            aria-label="Close expanded work view"
          >
            Close
          </button>
          <div class="work-modal__content">
            <div class="work-modal__stage">
              <button
                class="work-modal__nav work-modal__nav--prev"
                type="button"
                data-work-modal-prev
                aria-label="Previous image"
                hidden
              >
                &#8249;
              </button>
              <div class="work-modal__image" data-work-modal-image aria-hidden="true">
                <img class="work-modal__asset" data-work-modal-asset alt="" hidden />
              </div>
              <button
                class="work-modal__nav work-modal__nav--next"
                type="button"
                data-work-modal-next
                aria-label="Next image"
                hidden
              >
                &#8250;
              </button>
            </div>
            <div class="work-modal__copy">
              <p class="work-modal__counter" data-work-modal-counter hidden></p>
              <p class="eyebrow">Expanded View</p>
              <h2 id="work-modal-title" data-work-modal-title></h2>
              <p class="work-meta" data-work-modal-meta></p>
              <p data-work-modal-description hidden></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell footer-shell">
        <p>Dallas, Texas</p>
        <a class="email-link" href="mailto:francis.chung@gmail.com">francis.chung@gmail.com</a>
      </div>
    </footer>
  </body>
</html>
