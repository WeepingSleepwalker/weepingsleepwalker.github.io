        <h1>Recent ceramic figures.</h1>

      <section class="work-grid">
        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/OCT2026REvamp/thumbnails/Consanguinity_blue-figure_corrected.jpg?v=a92dfeaabcad"
                alt="Consanguinity II ceramic sculpture view"
                width="720"
                height="960"
                loading="lazy"
                decoding="async"
                data-work-modal-src="assets/workpics/OCT2026REvamp/Consanguinity_blue-figure_corrected.jpg?v=82280a94410b"
                data-work-video-src="assets/workpics/OCT2026REvamp/Consanguinity-II.mp4?v=d22d60802e5f"
              />
            </div>
            <div class="work-copy">
              <h2>Consanguinity II</h2>
              <p class="work-description">A blue child shields closed eyes from a light that may not exist. The gesture may suggest revelation, dread or an inherited expectation the figure cannot yet face. The brown paper bag held in the opposite hand gives the body a second, contradictory role: vulnerable child, reluctant worker and possible aggressor occupying the same form.</p>
              <p class="work-meta">2026 / Ceramic / 19" by 12" by 4"</p>
              <!-- Base material: wood. -->
              <p class="work-expand-label">Click to watch</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/OCT2026REvamp/thumbnails/BlowingClouds_corrected.jpg?v=2f7fdb188c5b"
                alt="Blowing Clouds ceramic sculpture view"
                width="720"
                height="960"
                loading="lazy"
                decoding="async"
                data-work-modal-src="assets/workpics/OCT2026REvamp/BlowingClouds_corrected.jpg?v=79ea7c5c16a4"
              />
            </div>
            <div class="work-copy">
              <h2>Blowing Clouds</h2>
              <p class="work-description">A crouching figure holds a cigarette as though it were a tiny source of heat, companionship or prayer. Smoke becomes a symbol of temporary escape: breath made visible just before it disappears. The wooden base reads simultaneously as pedestal, furniture and makeshift shelter.</p>
              <p class="work-meta">2026 / Ceramic / 12" by 7" by 7"</p>
              <!-- Base material: dark wood plinth. -->
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/OCT2026REvamp/thumbnails/Consanguinity_black-cat_corrected.jpg?v=40ea8f36b01c"
                alt="Consanguinity I ceramic sculpture view"
                width="720"
                height="960"
                loading="lazy"
                decoding="async"
                data-work-modal-src="assets/workpics/OCT2026REvamp/Consanguinity_black-cat_corrected.jpg?v=abdba7d4d75e"
                data-work-video-src="assets/workpics/OCT2026REvamp/Consanguinity-I.mp4?v=4fa1394377c7"
              />
            </div>
            <div class="work-copy">
              <h2>Consanguinity I</h2>
              <p class="work-description">The cat’s heavy lids and sealed expression suggest intimacy without access—the familiar creature that watches everything but offers nothing back. As a symbol of kinship, it raises the possibility that resemblance and proximity do not necessarily produce understanding. Its glossy black surface turns the domestic animal into an inscrutable family idol.</p>
              <p class="work-meta">2026 / Ceramic / 17" by 11" by 12"</p>
              <!-- Base material: wood. -->
              <p class="work-expand-label">Click to watch</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/OCT2026REvamp/thumbnails/Cry-baby-Cry_corrected.jpg?v=87652c7048f3"
                alt="Cry-baby, Cry ceramic sculpture view"
                width="720"
                height="960"
                loading="lazy"
                decoding="async"
                data-work-modal-src="assets/workpics/OCT2026REvamp/Cry-baby-Cry_corrected.jpg?v=65534f686db2"
              />
            </div>
            <div class="work-copy">
              <h2>Cry-baby, Cry</h2>
              <p class="work-description">The horned figure throws its head backward in a cry that could be anguish, accusation, ecstasy or performance. The horns transform a supposedly shameful emotional display into something ceremonial and defiant. What begins as an insult—“cry-baby”—becomes permission to make pain excessive, public and physically powerful.</p>
              <p class="work-meta">2026 / Ceramic / 12" by 12" by 15"</p>
              <!-- Base material: stone. -->
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/OCT2026REvamp/thumbnails/SuperStressed_corrected.jpg?v=d53613c95547"
                alt="Super Stressed ceramic sculpture view"
                width="720"
                height="960"
                loading="lazy"
                decoding="async"
                data-work-modal-src="assets/workpics/OCT2026REvamp/SuperStressed_corrected.jpg?v=70e8b764ab15"
                data-work-video-src="assets/workpics/OCT2026REvamp/SuperStressed.mp4?v=39568b7823cd"
              />
            </div>
            <div class="work-copy">
              <h2>Super Stressed</h2>
              <p class="work-description">A heroic mask rests on a neck too narrow to support it, and the seams of its construction remain visible. The superhero becomes a symbol not of power but of the exhausting obligation to appear powerful. The sculpture locates failure inside the costume itself: the face performs control while the body beneath it strains.</p>
              <p class="work-meta">2026 / Ceramic / 15" by 15" by 6"</p>
              <!-- Base material: wood. -->
              <p class="work-expand-label">Click to watch</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/OCT2026REvamp/thumbnails/Saturno-Devorando-a-su-Hijo_corrected.jpg?v=a3bd636ddadf"
                alt="Saturno devorando a su hijo ceramic sculpture view"
                width="720"
                height="960"
                loading="lazy"
                decoding="async"
                data-work-modal-src="assets/workpics/OCT2026REvamp/Saturno-Devorando-a-su-Hijo_corrected.jpg?v=577bc3b7b335"
                data-work-video-src="assets/workpics/OCT2026REvamp/Saturno-Devorando-a-su-Hijo.mp4?v=04b4b8033ed8"
              />
            </div>
            <div class="work-copy">
              <h2>Saturno devorando a su hijo</h2>
              <p class="work-description">The devouring father is no longer triumphant; he appears terrified by what he possesses and destroys. The child’s body may stand for inheritance, creative work, innocence or a future consumed by the person charged with protecting it. Here, appetite and love become almost indistinguishable, and violence returns to the aggressor as panic.</p>
              <p class="work-meta">2026 / Ceramic / 12" by 12" by 13"</p>
              <!-- Base material: stone. -->
              <p class="work-expand-label">Click to watch</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/OCT2026REvamp/thumbnails/Im-not-sad-Im-Disappointed_corrected.jpg?v=df55b958268b"
                alt="I’m Not Sad, I’m Disappointed ceramic sculpture view"
                width="720"
                height="960"
                loading="lazy"
                decoding="async"
                data-work-modal-src="assets/workpics/OCT2026REvamp/Im-not-sad-Im-Disappointed_corrected.jpg?v=ea0aa97c2b49"
                data-work-video-src="assets/workpics/OCT2026REvamp/Im-not-sad-Im-Disappointed.mp4?v=0ac2d1b4659b"
              />
            </div>
            <div class="work-copy">
              <h2>I’m Not Sad, I’m Disappointed</h2>
              <p class="work-description">The figure’s composed face contradicts the emotional charge of the title. Her carefully arranged features suggest the social discipline of converting hurt into judgment, distance or poise. Resting on stone, a passing expression acquires the weight and permanence of a monument.</p>
              <p class="work-meta">2026 / Ceramic / 10" by 10" by 15"</p>
              <!-- Base material: marble. -->
              <p class="work-expand-label">Click to watch</p>
            </div>
          </button>
        </article>
