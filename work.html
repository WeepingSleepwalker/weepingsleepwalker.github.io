  <body class="page-work">
    <div class="page-backdrop" aria-hidden="true"></div>
    <header class="site-header">
      <div class="shell header-shell">
        <a class="brand" href="index.html">Francis Chung</a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          data-menu-toggle
        >
          Menu
        </button>
        <nav class="site-nav" id="site-nav" data-site-nav>
          <a href="index.html">Home</a>
          <a href="work.html">Work</a>
          <a href="writing.html">Writing</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="shell page-main">
      <section class="page-intro" data-reveal>
        <p class="eyebrow">Selected Work</p>
        <h1>A selection of recent sculptural works and installations.</h1>
        <p class="page-summary">
          Selected works, 2018 &mdash; present.
        </p>
      </section>

      <section class="work-grid">
        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/Uprightness/uprightness-work.jpg"
                alt="Uprightness ceramic sculpture view"
                data-work-modal-src="assets/workpics/Uprightness/uprightness-view.jpg"
              />
            </div>
            <div class="work-copy">
              <h2>Uprightness</h2>
              <p class="work-meta">2026 / Ceramic / 14" by 6" by 6"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/imbusy/imbusy.jpeg"
                alt="imbusy ceramic sculpture view"
                data-work-modal-src="assets/workpics/imbusy/imbusy.jpeg"
              />
            </div>
            <div class="work-copy">
              <h2>imbusy</h2>
              <p class="work-meta">2026 / Ceramic / 18" by 17" by 17"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/Orange/Orange10_10_10.jpeg"
                alt="Orange ceramic sculpture view"
                data-work-modal-src="assets/workpics/Orange/Orange10_10_10.jpeg"
              />
            </div>
            <div class="work-copy">
              <h2>Orange</h2>
              <p class="work-meta">2025 / Ceramic / 10" by 10" by 10"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/SuperStressed/SuperStressedmax.jpeg"
                alt="SuperStressed ceramic sculpture view"
                data-work-modal-src="assets/workpics/SuperStressed/SuperStressedmax.jpeg"
              />
            </div>
            <div class="work-copy">
              <h2>SuperStressed</h2>
              <p class="work-meta">2026 / Ceramic / 17" by 13" by 6"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/FallenWatcher/FallenWatcher10_14_6.jpeg"
                alt="Fallen Watcher ceramic sculpture view"
                data-work-modal-src="assets/workpics/FallenWatcher/FallenWatcher10_14_6.jpeg"
              />
            </div>
            <div class="work-copy">
              <h2>Fallen Watcher</h2>
              <p class="work-meta">2024 / Ceramic / 10" by 14" by 6"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/Hornball/HornBall12_10_7.jpeg"
                alt="Hornball ceramic sculpture view"
                data-work-modal-src="assets/workpics/Hornball/HornBall12_10_7.jpeg"
              />
            </div>
            <div class="work-copy">
              <h2>Hornball</h2>
              <p class="work-meta">2026 / Ceramic / 12" by 10" by 7"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

        <article class="work-card" data-reveal>
          <button class="work-trigger" type="button" data-work-trigger aria-haspopup="dialog">
            <div class="work-image work-image--photo" aria-hidden="true">
              <img
                class="work-image__asset"
                src="assets/workpics/Reachingforfeelings/IMG_1825 2.jpeg"

                data-work-modal-src="assets/workpics/Reachingforfeelings/Reaching8_11_10.jpeg"

            <div class="work-copy">
              <h2>Reaching for Feelings</h2>
              <p class="work-meta">2026 / Ceramic / 8" by 11" by 10"</p>
              <p class="work-expand-label">Click to expand</p>
            </div>
          </button>
        </article>

      </section>

      <div class="work-modal" data-work-modal hidden>
        <button
          class="work-modal__backdrop"
          type="button"
          data-work-close
          tabindex="-1"
          aria-hidden="true"
        ></button>
        <div
          class="work-modal__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="work-modal-title"
        >
          <button
            class="work-modal__close"
            type="button"
            data-work-close
            aria-label="Close expanded work view"
          >
            Close
          </button>
          <div class="work-modal__content">
            <div class="work-modal__stage">
              <button
                class="work-modal__nav work-modal__nav--prev"
                type="button"
                data-work-modal-prev
                aria-label="Previous image"
                hidden
              >
                &#8249;
              </button>
              <div class="work-modal__image" data-work-modal-image aria-hidden="true">
                <img class="work-modal__asset" data-work-modal-asset alt="" hidden />
              </div>
              <button
                class="work-modal__nav work-modal__nav--next"
                type="button"
                data-work-modal-next
                aria-label="Next image"
                hidden
              >
                &#8250;
              </button>
            </div>
            <div class="work-modal__copy">
              <p class="work-modal__counter" data-work-modal-counter hidden></p>
              <p class="eyebrow">Expanded View</p>
              <h2 id="work-modal-title" data-work-modal-title></h2>
              <p class="work-meta" data-work-modal-meta></p>
              <p data-work-modal-description hidden></p>
            </div>
          </div>
        </div>
      </div>
